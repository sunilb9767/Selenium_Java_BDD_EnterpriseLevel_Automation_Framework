# Browser to use for test execution: chrome, firefox, edge
browser=chrome

# Set to true for Jenkins/CI runs, false for local debugging
headless=false

# Max seconds for explicit WebDriverWait conditions
explicitWait=15

# Max seconds for fluent wait \u2014 used for dynamic/unstable elements
fluentWaitTimeout=20

# Polling interval in seconds for fluent wait retry attempts
fluentWaitPolling=2

# Max seconds to wait for a full page to load
pageLoadTimeout=45

# Target environment: qa, staging, prod
env=qa

