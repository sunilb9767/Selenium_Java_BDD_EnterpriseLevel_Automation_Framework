# =====================================================================
# Spark HTML Reporter
# =====================================================================

# Enable Spark HTML reporter
extent.reporter.spark.start=true

# Output path for Spark HTML report
extent.reporter.spark.out=target/extent-reports/SparkReport/Spark.html

# =====================================================================
# PDF Reporter
# =====================================================================

# Enable PDF reporter
extent.reporter.pdf.start=true

# Output path for PDF report
extent.reporter.pdf.out=target/extent-reports/PdfReport/ExtentReport.pdf

# =====================================================================
# Screenshot configuration
# =====================================================================

# Directory where screenshots are saved by ScreenshotUtil
screenshot.dir=target/extent-reports/screenshots/

# Relative path from report file to screenshots directory
screenshot.rel.path=../../screenshots/

# =====================================================================
# System info shown in report dashboard
# =====================================================================

systeminfo.Project=Expand Testing Automation
systeminfo.Author=QA Team